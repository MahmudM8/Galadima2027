<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | GEN-Z FOR GALADIMA 2027</title>
<meta name="theme-color" content="#0a4d2e">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--green:#0a4d2e;--deep:#06331e;--sun:#ffc93c;--paper:#f5f8f4;--text:#14281d;--muted:#4d6155;--display:"Bricolage Grotesque","Arial Black",sans-serif;--body:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--green);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:1.25rem;line-height:1.5}
.box{background:var(--paper);width:min(26rem,100%);padding:2rem;border-radius:.75rem;border-top:8px solid var(--sun)}
.brand{font-family:var(--display);font-weight:800;color:var(--green);font-size:1.05rem}
h1{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1.1;margin:.6rem 0 1.4rem}
label{display:block;font-weight:600;margin-bottom:1rem}
input{display:block;width:100%;margin-top:.35rem;padding:.8rem .9rem;font:inherit;border:2px solid #b9c9be;border-radius:.4rem;background:#fff}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button{width:100%;padding:.95rem;font:inherit;font-weight:600;background:var(--green);color:#fff;border:0;border-radius:.4rem;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:1.4rem;color:#a11;margin-bottom:.8rem;font-size:.95rem}
.back{display:inline-block;margin-top:1.2rem;color:var(--muted);font-size:.95rem}
</style>
</head>
<body>
<main class="box">
  <div class="brand">GEN-Z FOR GALADIMA 2027</div>
  <h1>Canvasser sign in</h1>
  <form id="f" onsubmit="return false">
    <label>Email<input id="email" type="email" required autocomplete="username"></label>
    <label>Password<input id="pw" type="password" required autocomplete="current-password"></label>
    <p id="msg" role="alert"></p>
    <button id="btn">Sign in</button>
  </form>
  <a class="back" href="index.html">Back to home</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const say = t => { $('msg').textContent = t; };
// Admins go to the dashboard, canvassers go to the survey
const ADMIN_PAGE = 'admin.html';

let sb = null;
if (typeof supabase === 'undefined') say('Could not load the sign-in library. Check your internet connection and reload.');
else if (typeof SUPABASE_URL === 'undefined') say('config.js was not found. Keep it in the same folder as this page and name it exactly config.js (not config.js.txt).');
else if (SUPABASE_URL.includes('YOUR-PROJECT') || SUPABASE_ANON_KEY.includes('YOUR-ANON')) say('config.js still has the placeholder values. Paste your Project URL and anon key into it.');
else sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function go(uid) {
  let role = null;
  try { const { data } = await sb.from('profiles').select('role').eq('id', uid).single(); role = data && data.role; } catch (e) {}
  location.href = role === 'admin' ? ADMIN_PAGE : 'survey.html';
}

if (sb) sb.auth.getSession().then(({ data }) => { if (data.session) go(data.session.user.id); });

$('f').addEventListener('submit', async e => {
  e.preventDefault();
  if (!sb) return;
  say('');
  $('btn').disabled = true;
  try {
    const { data, error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pw').value });
    if (error) {
      const m = error.message || '';
      say(/invalid login/i.test(m) ? 'Wrong email or password. Check them and try again.'
        : /not confirmed/i.test(m) ? 'This account is not confirmed yet. In Supabase open Authentication > Users, open the user and confirm the email, or create the user again with "Auto Confirm User" ticked.'
        : 'Sign-in failed: ' + m);
      $('btn').disabled = false;
      return;
    }
    go(data.user.id);
  } catch (err) {
    say('Could not reach Supabase. Check your internet connection and the Project URL in config.js.');
    $('btn').disabled = false;
  }
});
</script>
</body>
</html>
